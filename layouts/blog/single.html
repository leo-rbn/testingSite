<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default .Summary }}">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <link rel="icon" type="image/png" href="{{ "favicon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}?v={{ now.Unix }}">
</head>
<body>
  {{ partial "site-header.html" . }}

  <main class="blog-entry shell">
    <header class="blog-entry-header">
      <p class="eyebrow">{{ .Date.Format "02.01.2006" }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.tags }}<p class="blog-entry-tags">{{ delimit . " / " }}</p>{{ end }}
    </header>
    <article class="blog-entry-content">
      {{ .Content }}
    </article>
  </main>

  <footer class="site-footer shell">
    <span>© {{ now.Year }} leorbn | built with <a href="https://gohugo.io/" target="_blank" rel="noopener noreferrer">hugo</a></span>
    <div class="social-links">
      <a href="https://github.com/leo-rbn" rel="noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/leorbn/" rel="noreferrer">LinkedIn</a>
      <a href="{{ "/" | relURL }}">Back to home ↑</a>
    </div>
  </footer>
</body>
</html>
